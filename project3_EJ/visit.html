<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Denver Zoo | Plan Your Visit</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/styles.min.css" rel="stylesheet" />
  </head>

  <body>
    <div class="container">
      <div data-include="includes/header.html"></div>
      <div data-include="includes/navigation.html"></div>

      <main>
        <h2 class="text-success text-center mb-4">Plan Your Visit</h2>

        <form
          class="needs-validation"
          action="https://www.w3schools.com/action_page.php"
          method="get"
          novalidate
        >
          <p class="text-danger">* - required fields</p>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="firstName" class="form-label fw-bold">
                First Name *
              </label>

              <input
                type="text"
                class="form-control"
                id="firstName"
                name="firstName"
                maxlength="40"
                pattern="[A-Za-z\s]+"
                required
              />

              <div class="invalid-feedback">
                Please enter a valid first name.
              </div>
            </div>

            <div class="col-md-6 mb-3">
              <label for="lastName" class="form-label fw-bold">
                Last Name *
              </label>

              <input
                type="text"
                class="form-control"
                id="lastName"
                name="lastName"
                maxlength="60"
                pattern="[A-Za-z\s]+"
                required
              />

              <div class="invalid-feedback">
                Please enter a valid last name.
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-bold"> Email * </label>

            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              required
            />

            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>

          <div class="mb-3">
            <label for="animals" class="form-label fw-bold">
              Favorite Animals
            </label>

            <select
              class="form-select"
              id="animals"
              name="animals"
              multiple
              size="3"
            >
              <option>Lion</option>
              <option>Tiger</option>
              <option>Elephant</option>
              <option>Polar Bear</option>
              <option>Otter</option>
            </select>
          </div>

          <fieldset class="border p-3 mb-3">
            <legend class="w-auto px-2 fw-bold small text-success">
              Membership Type *
            </legend>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="membership"
                id="single"
                required
              />

              <label class="form-check-label" for="single"> Single </label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="membership"
                id="family"
                required
              />

              <label class="form-check-label" for="family"> Family </label>
            </div>
          </fieldset>

          <fieldset class="border p-3 mb-3">
            <legend class="w-auto px-2 fw-bold small text-success">
              Activities Interested In
            </legend>

            <div class="form-check">
              <input
                id="tours"
                class="form-check-input"
                type="checkbox"
                value="Tours"
              />
              <label class="form-check-label" for="tours"> Guided Tours </label>
            </div>

            <div class="form-check">
              <input
                id="event"
                class="form-check-input"
                type="checkbox"
                value="Events"
              />
              <label class="form-check-label" for="event"> Events </label>
            </div>

            <div class="form-check">
              <input
                id="conservation"
                class="form-check-input"
                type="checkbox"
                value="Conservation"
              />
              <label class="form-check-label" for="conservation">
                Conservation Programs
              </label>
            </div>

            <div class="form-check">
              <input
                id="volunteering"
                class="form-check-input"
                type="checkbox"
                value="Volunteering"
              />
              <label class="form-check-label" for="volunteering">
                Volunteering
              </label>
            </div>
          </fieldset>

          <div class="mb-3">
            <label for="comments" class="form-label fw-bold"> Comments </label>

            <textarea class="form-control" id="comments" rows="4"></textarea>
          </div>

          <button class="btn btn-success mx-2" type="submit">Submit</button>

          <button class="btn btn-secondary mx-2" type="reset">
            Clear Form
          </button>
        </form>
      </main>

      <div data-include="includes/footer.html"></div>
    </div>

    <script src="/js/includeHTML.js"></script>
    <script src="/js/formValidation.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
